server {
    listen 80;
    server_name localhost;

    # 백엔드 주소 (필요 시 변경)
    # 같은 도메인으로 보이기 위해 프록시한다 — 그래야 httpOnly 쿠키가 same-origin으로 동작
    set $backend_upstream "http://125.141.20.218:3200";

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP: 모든 API 호출이 same-origin이 되었으므로 connect-src는 self만
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://stackpath.bootstrapcdn.com; img-src 'self' data: https: http://125.141.20.218:3200; font-src 'self' data: https://stackpath.bootstrapcdn.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # HTTPS 종료 후 활성화 (현재는 listen 80 plain HTTP라 주석 처리)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # /api/* → 백엔드로 리버스 프록시 (브라우저는 same-origin으로 인식 → 쿠키 정상 동작)
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # 업로드/응답 큰 파일 대응 (백엔드 한도 1GB/5GB와 정합)
        client_max_body_size 5g;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
