server {
    listen 80;
    server_name localhost;

    # 백엔드 주소: NAS 호스트 도커 브리지 게이트웨이(172.17.0.1) 경유.
    # 공인 IP(hairpin NAT)에 의존하지 않으므로 외부 포트가 닫혀도 안전하게 동작.
    # 같은 도메인으로 보이기 위해 프록시한다 — 그래야 httpOnly 쿠키가 same-origin으로 동작
    set $backend_upstream "http://172.17.0.1:3200";

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP: 모든 API 호출이 same-origin이 되었으므로 connect-src는 self만
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://stackpath.bootstrapcdn.com; img-src 'self' data: https:; font-src 'self' data: https://stackpath.bootstrapcdn.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Synology 역방향 프록시에서 TLS 종료 후 X-Forwarded-Proto=https 가 들어오므로 HSTS 활성화
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # /api/* → 백엔드로 리버스 프록시 (브라우저는 same-origin으로 인식 → 쿠키 정상 동작)
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # 업로드/응답 큰 파일 대응 (백엔드 한도 1GB/5GB와 정합)
        client_max_body_size 5g;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # /uploads/* → 백엔드의 정적 리소스(이미지/영상) 프록시
    # 백엔드 application-docker.yml의 upload-base-url이 비어 있으면 WebConfig가 직접 서빙,
    # 설정돼 있으면 UploadRedirectController가 302로 리다이렉트한다.
    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 정적 미디어는 캐시 + 큰 응답 대응
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 5g;
    }

    # 해시 붙은 정적 자산은 장기 캐시 (파일명 hash가 바뀌면 자동으로 새로 받음)
    # add_header 사용으로 server 레벨 보안 헤더 상속이 끊기므로 HSTS만 다시 명시.
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|webp|ico|map)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # HTML / SPA 라우팅: 캐시 금지 — 새 배포가 사용자 브라우저에 즉시 반영되도록
    # expires 사용(no-cache)으로 server 레벨 보안 헤더 상속 유지.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
