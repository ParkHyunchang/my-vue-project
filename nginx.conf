server {
    listen 80;
    server_name localhost;

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP: Vue/Bootstrap CDN 사용 + 동적 인라인 스타일 사용 환경
    # - script-src: self만 (인라인 스크립트 차단). 'unsafe-eval'은 webpack 개발 빌드 외에는 불필요.
    # - style-src: self + Bootstrap CDN + 인라인 스타일(Vue scoped style 동적 주입)
    # - img-src: self + data: + https: (외부 이미지 표시 가능)
    # - connect-src: self + 백엔드 API (필요 시 도메인 추가)
    # - frame-ancestors: 'none' (X-Frame-Options 보강)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://stackpath.bootstrapcdn.com; img-src 'self' data: https:; font-src 'self' data: https://stackpath.bootstrapcdn.com; connect-src 'self' http://hyunchang.synology.me:3200 https://hyunchang.synology.me:3200; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # HTTPS 종료 후 활성화 (현재는 listen 80 plain HTTP라 주석 처리)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
