name: Frontend CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vue app
        run: npm run build

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag (lowercase)
        run: echo "IMAGE_NAME=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]'):latest" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}

      - name: Deploy to NAS via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          password: ${{ secrets.NAS_SSH_PASSWORD }}
          envs: GHCR_PAT,GITHUB_ACTOR,IMAGE_NAME
          script: |
            DOCKER=/usr/local/bin/docker
            export PATH="/usr/local/bin:$PATH"
            echo "$GHCR_PAT" | $DOCKER login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            $DOCKER pull "$IMAGE_NAME"
            # 기존 internal 네트워크는 Synology에서 호스트 포트 공개가 되지 않는 경우가 있어,
            # 백엔드 포트를 열지 않는 전용 bridge 네트워크로 단계적으로 이전한다.
            $DOCKER network inspect my-vue-project-private >/dev/null 2>&1 || \
              $DOCKER network create my-vue-project-private
            # 백엔드가 아직 이전 배포 상태여도 새 프론트가 내부망으로 접근할 수 있게 연결한다.
            $DOCKER network connect my-vue-project-private vue_personal_project-backend 2>/dev/null || true
            $DOCKER stop vue_personal_project 2>/dev/null || true
            $DOCKER rm vue_personal_project 2>/dev/null || true
            $DOCKER run -d \
              --name vue_personal_project \
              --restart unless-stopped \
              --network my-vue-project-private \
              -p 127.0.0.1:3100:80 \
              "$IMAGE_NAME"
            $DOCKER image prune -f
            echo "✅ 프론트엔드 배포 완료!"
            $DOCKER ps | grep vue_personal_project
