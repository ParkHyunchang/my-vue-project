version: "3.8"

services:
  vue_app:
    container_name: vue_personal_project
    image: vue_personal_project:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3100:80"
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    name: my-vue-project-private
    external: true
